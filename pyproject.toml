[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kuairand-research-agent"
version = "0.1.0"
description = "Autonomous ML research loop and human cockpit for KuaiRand recommender experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kuairand-agent = "research_agent.cli:main"

[tool.setuptools]
packages = ["research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
